# TLS, for every server block that terminates it.
#
# nginx 1.18 — which is what astral runs — defaults `ssl_protocols` to
# `TLSv1 TLSv1.1 TLSv1.2`. That is TLS 1.0 and 1.1 *accepted* and TLS 1.3 not
# offered at all, which is the opposite of both halves of what you want in 2026.
# The config said nothing on the subject, so the default stood.
#
# `docs/36` uses `certbot certonly`, so certbot never wrote its own
# `options-ssl-nginx.conf` for this host. This file is that file, kept in the
# repository where it can be read and reviewed rather than in a directory
# somebody has to remember exists.

ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3 picks its own suites. This list is the 1.2 fallback: forward secrecy
# and AEAD only, no CBC, no RSA key exchange.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# The client's order, which is the modern advice: clients know what is fast on
# their own hardware, and every suite above is one we are happy with.
ssl_prefer_server_ciphers off;

# Resumption, so a reconnecting phone is not a fresh handshake. Tickets are off
# because a ticket key that outlives a session is forward secrecy given back.
ssl_session_cache shared:revel_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling, so a client does not have to ask the CA — which tells the CA
# who is visiting.
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 9.9.9.9 valid=300s;
resolver_timeout 5s;
