# revel.chat — the SPA, the Host, and the socket.
#
# The web app is `adapter-static` with an `index.html` fallback, so nginx
# serves it from disk and there is no Node process in front of it. Everything
# under the API prefixes goes to the Host on 127.0.0.1:8090.
#
# The prefix list is generated, not remembered:
#
#   grep -rhoE "app\.(get|post|put|delete)\('/[a-z.-]+" apps/server/src
#
# Getting it wrong does not look like a proxy problem. It looks like devices
# that register and can never authenticate, or a client that signs in and can
# never open a room — which is exactly how the dev proxy lost `/auth` and then
# `/rooms`, twice.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name revel.chat www.revel.chat;

    # Before the redirect, or renewals fail: certbot needs to serve a file over
    # plain HTTP and a 301 is not a file.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://revel.chat$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.revel.chat;

    ssl_certificate     /etc/letsencrypt/live/revel.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revel.chat/privkey.pem;

    return 301 https://revel.chat$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name revel.chat;

    ssl_certificate     /etc/letsencrypt/live/revel.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revel.chat/privkey.pem;

    # Attachments are encrypted client-side and can be large. The default 1m
    # would reject them with a 413 that says nothing about size.
    client_max_body_size 64m;

    root /mnt/blockvol/revel/web;
    index index.html;

    # --- the API ----------------------------------------------------------
    #
    # `/.well-known` is proxied because `security.txt` is served by the Host,
    # but the ACME challenge underneath it is **not** — that location is more
    # specific, so nginx matches it first, and without it every certificate
    # renewal from here on would fail.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # `invites`, not `i` — `/i/<code>` is the SPA route somebody follows and
    # `/invites/<code>` is the unauthenticated preview behind it. Anchored and
    # followed by `/` or end, so `/invitesomething` is not swallowed.
    location ~ ^/(idp|auth|rooms|spaces|groups|welcomes|blobs|push|invites|health|\.well-known)(/|$) {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # `REVEL_TRUST_PROXY=1` is only correct *because* this line exists.
        # Setting the flag without something rewriting the header lets any
        # client claim any address, which turns every per-address rate limit
        # into a formality.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- the socket -------------------------------------------------------
    #
    # A WebSocket upgrade is not an HTTP proxy hop. Without the Upgrade and
    # Connection headers the socket connects to nginx and hangs there, and the
    # app looks like it is working right up until nothing arrives.
    location /socket {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A socket that is idle is not a socket that is dead. The default 60s
        # closes live connections and makes the client reconnect for nothing.
        proxy_read_timeout 3600s;
        # Buffering a stream defeats the point of it being one.
        proxy_buffering off;
    }

    # --- the app ----------------------------------------------------------
    location /_app/immutable/ {
        # Hashed filenames. Safe to cache forever, and the reason a reload is
        # fast rather than a fresh download of everything.
        expires 1y;
        add_header Cache-Control "public, immutable";

        # astral runs nginx 1.18, whose `mime.types` predates WebAssembly —
        # there is no `wasm` entry in it, so the crypto core was served as
        # `application/octet-stream`. `WebAssembly.instantiateStreaming`
        # refuses anything that is not `application/wasm` and falls back to
        # buffering the whole module and compiling it, which is the slower path
        # and the one it exists to avoid. It logged the reason on every load,
        # twice — once on the main thread and once in the worker.
        #
        # `default_type` rather than a `types` block: a `types` block here
        # would *replace* the inherited map rather than add to it, and every
        # other file in this directory would lose its type. `default_type` only
        # applies where the map has no answer, which for `.wasm` on this nginx
        # is exactly the case.
        #
        # A nested location so the cache headers above still apply — a regex
        # location at server level would outrank this prefix one and quietly
        # drop them.
        location ~ \.wasm$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            default_type application/wasm;
        }
    }

    location / {
        # SPA fallback. Every route the client owns — /app, /signin,
        # /security — is served by the same index.html and resolved in the
        # browser.
        try_files $uri $uri/ /index.html;
    }
}
