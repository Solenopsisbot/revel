# Response headers, included wherever nginx answers.
#
# `include`d rather than set once at server level, because `add_header` does
# **not** inherit into a location that sets one of its own — the immutable-asset
# block sets `Cache-Control`, and that alone was enough to drop every header
# below from every script, stylesheet and wasm module the app loads. That is the
# nginx footgun this file exists to avoid repeating by hand.
#
# `always`, so they are present on error responses too. A 404 or a 502 is
# rendered in the same origin as everything else.

# `frame-ancestors` only, and the rest of the policy is *not* here.
#
# It was here, in full, and it broke the app: SvelteKit writes one inline
# `<script>` into every page — the bootstrap that sets `__sveltekit_<id>` and
# starts everything — and the id is random per build, so its hash is too. A
# `script-src` written by hand in nginx cannot name a hash it cannot know, and a
# policy that does not name it blocks it. The result was a page that served its
# markup and never hydrated.
#
# So the policy is emitted by the build instead (`apps/web/svelte.config.js`,
# `csp: { mode: 'hash' }`), which puts the right hash in a `<meta>` next to the
# script it belongs to. `frame-ancestors` stays here because it is the one
# directive a `<meta>` policy is not allowed to carry, and the two compose — a
# browser enforces every policy it is handed.
add_header Content-Security-Policy "frame-ancestors 'none'" always;

# A year, and the app is https-only anyway. Not preloaded: that is a decision
# with a slow undo, and it belongs to whoever owns the domain.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# No sniffing. The Host serves every attachment as application/octet-stream
# precisely so a sender cannot choose how the browser treats their bytes, and
# this is the header that makes that stick.
add_header X-Content-Type-Options "nosniff" always;

# `frame-ancestors 'none'` above is the real one; this is for anything that
# predates it. Both matter here — `/i/<code>` and `/add-device` are screens
# where somebody is asked to confirm something consequential.
add_header X-Frame-Options "DENY" always;

# An invite code lives in the path. Nothing outside this origin needs to be told
# which one somebody followed.
add_header Referrer-Policy "same-origin" always;

# Camera and microphone stay available: voice rooms are a feature. Everything
# else this app has no business asking for.
add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(self), display-capture=(self), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;
