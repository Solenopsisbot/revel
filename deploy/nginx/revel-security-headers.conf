# Response headers, included wherever nginx answers.
#
# `include`d rather than set once at server level, because `add_header` does
# **not** inherit into a location that sets one of its own — the immutable-asset
# block sets `Cache-Control`, and that alone was enough to drop every header
# below from every script, stylesheet and wasm module the app loads. That is the
# nginx footgun this file exists to avoid repeating by hand.
#
# `always`, so they are present on error responses too. A 404 or a 502 is
# rendered in the same origin as everything else.

# The policy is strict because it can be: this app loads nothing from anywhere
# else. Fonts are self-hosted (`apps/web/src/fonts.css`) and the appearance
# script is a file (`static/theme-init.js`), which is what makes `'self'`
# achievable for both.
#
# For an end-to-end encrypted client this is not decoration. The honest limit in
# the README is that "a web client can be backdoored on any load"; a CSP does
# not fix that, but it does mean a DOM sink somewhere in the app cannot be
# turned into a way to *send the key material anywhere*, because there is
# nowhere to send it to.
#
#   wasm-unsafe-eval  the crypto core is WebAssembly, on the main thread and in
#                     the worker; without this it will not instantiate at all.
#   style-src unsafe-inline
#                     Svelte injects component styles as inline <style>. Removing
#                     it needs a nonce threaded through SSR, and this app is
#                     statically rendered with no server to thread it from.
#   connect-src       the Host is same-origin, so 'self' covers both the REST
#                     surface and the WebSocket.
#   blob:             attachments are decrypted in the tab and rendered from a
#                     blob URL; they are never fetched from anywhere.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; manifest-src 'self'" always;

# A year, and the app is https-only anyway. Not preloaded: that is a decision
# with a slow undo, and it belongs to whoever owns the domain.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# No sniffing. The Host serves every attachment as application/octet-stream
# precisely so a sender cannot choose how the browser treats their bytes, and
# this is the header that makes that stick.
add_header X-Content-Type-Options "nosniff" always;

# `frame-ancestors 'none'` above is the real one; this is for anything that
# predates it. Both matter here — `/i/<code>` and `/add-device` are screens
# where somebody is asked to confirm something consequential.
add_header X-Frame-Options "DENY" always;

# An invite code lives in the path. Nothing outside this origin needs to be told
# which one somebody followed.
add_header Referrer-Policy "same-origin" always;

# Camera and microphone stay available: voice rooms are a feature. Everything
# else this app has no business asking for.
add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(self), display-capture=(self), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;
