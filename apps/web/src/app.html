<!doctype html>
<html lang="en" data-theme="dusk" data-density="cozy" data-personality="full">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` so the app reaches under the notch and the home
      indicator, with `env(safe-area-inset-*)` doing the actual keeping-out.

      `interactive-widget=resizes-content` is the Chrome-on-Android half of the
      keyboard problem: without it the layout viewport stays full height when
      the keyboard opens and the composer ends up behind it. Safari ignores the
      key, which is why `layout.svelte.ts` also tracks `visualViewport` — the
      two together cover both.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The mark (`docs/15-mark.md`), not Wren: she is the guide, not the
         product, and `docs/09` is explicit that she does not belong on chrome.
         SVG so it is sharp at every size the mark was designed for — 48 down
         to 12 — without shipping five PNGs. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The type faces are served from this origin — see `src/fonts.css`. They
      used to come from Google's CDN, which told a third party the address and
      user agent of everybody who opened any page, including the invite page
      somebody follows before they have an account. That is a poor footnote on a
      product whose claim is that even the server it talks to cannot read
      anything.
    -->
    <!-- Appearance before first paint. A file rather than an inline script so
         the CSP can say `script-src 'self'` without a nonce or a hash. -->
    <script src="/theme-init.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
