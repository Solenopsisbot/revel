<!doctype html>
<html lang="en" data-theme="dusk" data-density="cozy" data-personality="full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The mark (`docs/15-mark.md`), not Wren: she is the guide, not the
         product, and `docs/09` is explicit that she does not belong on chrome.
         SVG so it is sharp at every size the mark was designed for — 48 down
         to 12 — without shipping five PNGs. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght,SOFT@9..144,500..700,50&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint: reads the stored appearance and stamps the
      // attributes the token layer reads. Doing this in a component would mean
      // a frame of the default theme first.
      (() => {
        try {
          var q = new URLSearchParams(location.search);
          var a = JSON.parse(localStorage.getItem('revel.appearance') || '{}');
          var el = document.documentElement;
          el.dataset.theme = q.get('theme') || a.theme || 'dusk';
          el.dataset.density = q.get('density') || a.density || 'cozy';
          el.dataset.personality = q.get('personality') || a.personality || 'full';
        } catch (e) {
          /* storage unavailable; the defaults in the markup stand */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
