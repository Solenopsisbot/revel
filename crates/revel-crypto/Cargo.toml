[package]
name = "revel-crypto"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# cdylib for UniFFI (Swift/Kotlin) and wasm; rlib so Rust tests still work.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mls-rs = "0.56"
mls-rs-core = "0.27"
mls-rs-crypto-rustcrypto = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "2"
# Sealing local group state (src/store.rs). All three are already in the tree
# via mls-rs-crypto-rustcrypto; naming them directly keeps the versions pinned
# where they are used rather than wherever the resolver happens to put them.
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
# Argon2id for the recovery-code wrap (`docs/03` §1). A recovery code is short
# enough to be typed by a human, which makes it guessable at hashing speed and
# not at KDF speed — the memory-hard KDF is the entire reason the wrap is worth
# anything. RustCrypto's, so it is the same provenance as everything above.
argon2 = "0.5"

# Entropy on wasm32 has no OS underneath, so getrandom needs an explicit
# backend. Both major versions are in the tree (rand 0.8 pulls 0.2, newer
# crates pull 0.3) and they configure it differently: 0.2 takes a "js" feature,
# 0.3 takes "wasm_js" AND a --cfg flag, set in .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_v3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# The web binding (src/wasm.rs). Pinned to the same minor as the installed
# wasm-bindgen CLI — the generated glue and the crate's ABI must agree, and a
# mismatch fails at bindgen time with a version banner rather than at runtime.
wasm-bindgen = "0.2.127"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# UniFFI targets native platforms (Swift/Kotlin over a C ABI); it and proptest
# are excluded from wasm32, which gets its own test suite in tests/wasm.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "0.32", features = ["cli"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"
uniffi = { version = "0.32", features = ["bindgen-tests"] }

[dev-dependencies]
# `external_client` is how a Host observes a group it is not in, which is what
# `docs/03` §5's external-sender proposals need. A dev-dependency feature, so
# the shipped wasm never carries the module — the binding has no use for it and
# the server is TypeScript.
mls-rs = { version = "0.56", features = ["external_client"] }
assert_matches = "1.5"

[features]
pq = ["dep:mls-rs-crypto-awslc"]

[dependencies.mls-rs-crypto-awslc]
version = "0.25"
optional = true
features = ["post-quantum"]

# The PQ benchmark needs AWS-LC, which is optional — without this the default
# `cargo test` tries to build it and fails on the missing import.
[[example]]
name = "bench_pq"
required-features = ["pq"]

[[example]]
name = "bench_join"
required-features = ["pq"]
