# getrandom 0.3 refuses to pick a wasm32 backend implicitly — it wants to be
# told, so that a target with no entropy source fails loudly rather than
# silently returning predictable bytes. Required for the wasm test suite.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
runner = "wasm-bindgen-test-runner"
